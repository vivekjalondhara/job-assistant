services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio-test-only
      POSTGRES_DB: folio_test
    ports: ["127.0.0.1:55439:5432"]
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: folio-test
      MINIO_ROOT_PASSWORD: folio-test-only
    ports: ["127.0.0.1:59039:9000"]
